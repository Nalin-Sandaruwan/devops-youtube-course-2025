server {
    listen 80;
    server_name 54.146.170.255; # Replace with your domain name later (e.g., example.com)

    # Allow Let's Encrypt to verify the domain (for SSL setup later)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS (Uncomment this block after setting up SSL)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # FRONTEND CONFIGURATION
    location / {
        proxy_pass http://frontend:5173; # Matches container_name in docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # BACKEND API CONFIGURATION (Reverse Proxy)
    location /api/ {
        proxy_pass http://backend:5000; # Matches container_name in docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

