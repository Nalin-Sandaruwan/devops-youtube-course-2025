# Two services: backend API on 5000, frontend (nginx) on 80
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend

  backend:
    build: ./server
    container_name: backend
    restart: always
    env_file:
      - ./server/.env        
    expose:
        - "5000:5000"

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: frontend
    restart: always
    expose:
        - "5173:5173"
    depends_on:
      - backend